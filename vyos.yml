name: vyos

topology:
  nodes:
    br:
      kind: linux
      image: br:1.0
      binds:
        - br/dnsmasq.conf:/etc/dnsmasq.conf
        - br/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    r:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: r/config.boot
      binds:
        - r/custom-frr:/opt/custom-frr
        - r/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    vyos1:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos1/config.boot
      binds:
        - vyos1/custom-frr:/opt/custom-frr
        - vyos1/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    vyos2:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos2/config.boot
      binds:
        - vyos2/custom-frr:/opt/custom-frr
        - vyos2/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    vyos3:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos3/config.boot
      binds:
        - vyos3/custom-frr:/opt/custom-frr
        - vyos3/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    tacacs:
      kind: linux
      image: tacacs:1.0
      binds:
        - tacacs/tac_plus.conf:/etc/tac_plus.conf
        - tacacs/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    chrome:
      kind: linux
      image: chrome:1.0
      ports:
        - "5900:5900"
      binds:
        - chrome/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    nginx:
      kind: linux
      image: nginx:1.0
      ports:
        - "8080:80"
      binds:
        - nginx/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    br-dc:
      kind: bridge
  links:
    - endpoints: ["chrome:eth1", "br:eth1"]
    - endpoints: ["br:eth2", "vyos1:eth1"]
    - endpoints: ["vyos1:eth2", "vyos2:eth1"]
    - endpoints: ["vyos2:eth2", "vyos3:eth1"]
    - endpoints: ["vyos2:eth3", "tacacs:eth1"]
    - endpoints: ["vyos3:eth2", "br-dc:br1p1"]
    - endpoints: ["r:eth1", "br-dc:br1p2"]
    - endpoints: ["r:eth2", "nginx:eth1"]

