name: vyos

topology:
  nodes:
    vyos1:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos1/config.boot
      binds:
        - vyos1/custom-frr:/opt/custom-frr
        - vyos1/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    vyos2:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos2/config.boot
      binds:
        - vyos2/custom-frr:/opt/custom-frr
        - vyos2/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    vyos3:
      kind: vyosnetworks_vyos
      image: vyos:latest
      startup-config: vyos3/config.boot
      binds:
        - vyos3/custom-frr:/opt/custom-frr
        - vyos3/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    tacacs:
      kind: linux
      image: aaa:1.0
      binds:
        - tacacs/tac_plus.conf:/etc/tac_plus.conf
        - tacacs/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    chrome:
      kind: linux
      image: nkpro/chrome-vnc:latest
      ports:
        - "5900:5900"
      binds:
        - chrome/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
    nginx:
      kind: linux
      image: nginx:1.0
      ports:
        - "8080:80"
      binds:
        - nginx/cmd.sh:/cmd.sh
      exec:
        - bash /cmd.sh
  links:
    - endpoints: ["chrome:eth1", "vyos1:eth1"]
    - endpoints: ["vyos1:eth2", "vyos2:eth1"]
    - endpoints: ["vyos2:eth2", "vyos3:eth1"]
    - endpoints: ["vyos2:eth3", "tacacs:eth1"]
    - endpoints: ["vyos3:eth2", "nginx:eth1"]

