frr defaults traditional
hostname r
log syslog notifications
log timestamp precision 3
no log unique-id
service integrated-vtysh-config
!
ip route 0.0.0.0/0 100.0.0.254
!
vrf Mgmt
exit-vrf
!
vrf ent
exit-vrf
!
interface eth1
 ip address 100.0.0.100/24
exit
!
interface eth2
 ip address 1.0.0.254/24
exit
!
end
